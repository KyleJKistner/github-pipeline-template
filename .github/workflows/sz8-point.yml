name: Temporary Sz8 point search

on:
  push:
    branches:
      - research-sz8-rank-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mwrank-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bound: [10, 30, 100, 300]
    container:
      image: sagemath/sagemath:10.9
    steps:
      - name: Search for a non-torsion point
        shell: bash
        run: |
          set -o pipefail
          mwrank_path=$(sage -python - <<'PY'
          from sage.features.eclib import Mwrank
          print(Mwrank().absolute_filename())
          PY
          )
          echo "MWRANK=$mwrank_path"
          "$mwrank_path" --help 2>&1 | head -80 || true

          curve='[0,0,1,-147036293428447300,31096531290525027422504031]'
          echo "CURVE=$curve BOUND=${{ matrix.bound }}"
          printf '%s\n' "$curve" | timeout 11m "$mwrank_path" -v 3 -b ${{ matrix.bound }} -S 1000
