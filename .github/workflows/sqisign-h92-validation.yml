name: SQIsign H9.2 validation

on:
  push:
    branches: [research/sqisign-h92-validation]
  pull_request:
    branches: [main]
    paths:
      - validation/**
      - .github/workflows/sqisign-h92-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqisign-h92-${{ github.ref }}
  cancel-in-progress: true

env:
  SQISIGN_COMMIT: dd133d7aca576c361a270c8e6434832535b42ecc

jobs:
  kat-fixtures:
    name: Generate unpatched reference KATs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgmp-dev

      - name: Checkout pinned unpatched SQIsign
        run: |
          git clone https://github.com/SQISign/the-sqisign.git sqisign-baseline
          cd sqisign-baseline
          git checkout "$SQISIGN_COMMIT"
          test "$(git rev-parse HEAD)" = "$SQISIGN_COMMIT"

      - name: Build KAT generators
        run: |
          cmake -S sqisign-baseline -B build-kat -G Ninja \
            -DSQISIGN_BUILD_TYPE=ref \
            -DGMP_LIBRARY=SYSTEM \
            -DENABLE_SIGN=ON \
            -DENABLE_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-kat --parallel 2 --target \
            PQCgenKAT_sign_lvl1 PQCgenKAT_sign_lvl3 PQCgenKAT_sign_lvl5

      - name: Generate baseline response files
        run: |
          mkdir KAT
          cd KAT
          ../build-kat/apps/PQCgenKAT_sign_lvl1
          ../build-kat/apps/PQCgenKAT_sign_lvl3
          ../build-kat/apps/PQCgenKAT_sign_lvl5
          rm -f *.req
          sha256sum *.rsp | tee SHA256SUMS

      - name: Upload baseline KATs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: sqisign-baseline-kat-${{ github.run_id }}
          path: KAT
          if-no-files-found: error
          retention-days: 14

  reference:
    name: Reference ${{ matrix.build_type }}
    needs: kat-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug, ASAN, UBSAN]
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download unpatched reference KATs
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: sqisign-baseline-kat-${{ github.run_id }}
          path: KAT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgmp-dev

      - name: Checkout pinned SQIsign source
        run: |
          git clone https://github.com/SQISign/the-sqisign.git sqisign
          cd sqisign
          git checkout "$SQISIGN_COMMIT"
          test "$(git rev-parse HEAD)" = "$SQISIGN_COMMIT"

      - name: Apply deterministic H9.2.2 repair
        run: |
          python3 validation/apply_h922_patch.py sqisign/src/hd/ref/lvlx/theta_isogenies.c
          cd sqisign
          git diff --check
          git diff -- src/hd/ref/lvlx/theta_isogenies.c | tee ../h922.patch.diff

      - name: Configure
        run: |
          cmake -S sqisign -B build-${{ matrix.build_type }} -G Ninja \
            -DSQISIGN_BUILD_TYPE=ref \
            -DGMP_LIBRARY=SYSTEM \
            -DENABLE_SIGN=ON \
            -DENABLE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build-${{ matrix.build_type }} --parallel 2

      - name: Run non-KAT test suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build-${{ matrix.build_type }} \
            --output-on-failure --timeout 7200 -E '_KAT$' -j 2

      - name: Run exact baseline KAT comparison
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [ '${{ matrix.build_type }}' = Release ]; then
            ctest --test-dir build-${{ matrix.build_type }} \
              --output-on-failure --timeout 7200 -R '_KAT$' -j 2
          else
            cd build-${{ matrix.build_type }}/test
            ./sqisign_test_kat_lvl1 0
            ./sqisign_test_kat_lvl3 0
            ./sqisign_test_kat_lvl5 0
          fi

      - name: Upload source diff and test logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: h922-reference-${{ matrix.build_type }}-${{ github.run_id }}
          path: |
            h922.patch.diff
            build-${{ matrix.build_type }}/Testing/Temporary/LastTest.log
            KAT/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

  broadwell:
    name: Broadwell release
    needs: kat-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download unpatched reference KATs
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: sqisign-baseline-kat-${{ github.run_id }}
          path: KAT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgmp-dev

      - name: Checkout and patch pinned SQIsign
        run: |
          git clone https://github.com/SQISign/the-sqisign.git sqisign
          cd sqisign
          git checkout "$SQISIGN_COMMIT"
          cd ..
          python3 validation/apply_h922_patch.py sqisign/src/hd/ref/lvlx/theta_isogenies.c

      - name: Configure and build Broadwell backend
        run: |
          cmake -S sqisign -B build-broadwell -G Ninja \
            -DSQISIGN_BUILD_TYPE=broadwell \
            -DGMP_LIBRARY=SYSTEM \
            -DENABLE_SIGN=ON \
            -DENABLE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-broadwell --parallel 2

      - name: Run complete Broadwell test suite
        run: ctest --test-dir build-broadwell --output-on-failure --timeout 7200 -j 2

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: h922-broadwell-${{ github.run_id }}
          path: |
            build-broadwell/Testing/Temporary/LastTest.log
            KAT/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
